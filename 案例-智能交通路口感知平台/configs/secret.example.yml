# 敏感配置示例
# 实际值不入库，CI 通过 secrets 注入。
# 本文件仅作 schema 示意。

mqtt_broker:
  host: mqtt.example.com
  port: 8883
  tls:
    enabled: true
    ca: /etc/edgevision/ca.crt
    cert: /etc/edgevision/device.crt
    key: /etc/edgevision/device.key
  credentials:
    username: ${MQTT_USER}
    password: ${MQTT_PASS}

grpc_server:
  tls:
    cert: /etc/edgevision/grpc.crt
    key:  /etc/edgevision/grpc.key

ota:
  signing_key: ${COSIGN_KEY}
  update_server: https://ota.example.com

cloud_api:
  endpoint: https://api.example.com
  api_key: ${CLOUD_API_KEY}
