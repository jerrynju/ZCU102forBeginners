# YOLOv8 数据集配置文件
# 智能路口感知：车辆与行人检测

path: /data/traffic_intersection  # 数据集根目录
train: images/train               # 训练集（相对于 path）
val:   images/val
test:  images/test

# 类别数量
nc: 6

# 类别名称（按 ID 排列）
names:
  0: car          # 小轿车、SUV、MPV
  1: truck        # 重型货车（含半挂）
  2: bus          # 公共汽车、中巴
  3: person       # 行人（含骑车人）
  4: motorcycle   # 摩托车、电动车
  5: bicycle      # 自行车

# 数据集统计（供参考）
# train: ~80,000 张（含夜间 20%、雨天 10%、逆光 5%）
# val:   ~10,000 张
# test:  ~10,000 张（含独立采集的困难样本）

# 数据来源说明：
# 1. VisDrone-2023:      45,000 张（无人机视角，适合远距离小目标）
# 2. UA-DETRAC:          15,000 张（路口监控视角）
# 3. 私有采集（北京）:   30,000 张（覆盖四季/全天候）

# 标注说明：
# - 格式：YOLO txt（归一化坐标）
# - 最小目标尺寸：32×32 像素（4K 分辨率下）
# - 遮挡阈值：仅标注可见面积 > 30% 的目标
